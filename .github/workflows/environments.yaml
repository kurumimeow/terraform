name: Main Environment Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

jobs:
  # DEV
  dev-plan:
    name: DEV
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: dev
      step: plan

  dev-apply:
    name: DEV
    needs: dev-plan
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: dev
      step: apply

  # NPR
  npr-plan:
    name: NPR
    needs: dev-apply
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: npr
      step: plan

  npr-apply:
    name: NPR
    needs: npr-plan
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: npr
      step: apply

  # PRD
  prd-plan:
    name: PRD
    needs: npr-apply
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: prd
      step: plan

  prd-apply:
    name: PRD
    needs: prd-plan
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: prd
      step: apply
