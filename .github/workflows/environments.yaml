name: Main Environment Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

jobs:
  deploy-dev:
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: dev

  deploy-npr:
    needs: deploy-dev
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: npr

  deploy-prd:
    needs: deploy-npr
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: prd
