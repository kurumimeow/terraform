name: Main Environment Pipeline

on:
  push:
    branches:
      - feature/*
  workflow_dispatch:
    inputs:
      skip_dev:
        description: 'Skip DEV Environment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_npr:
        description: 'Skip NPR Environment'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_prd:
        description: 'Skip PRD Environment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # DEV
  dev-plan:
    name: DEV
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: dev
      step: plan
    if: ${{ inputs.skip_dev != 'true' }}

  dev-apply:
    name: DEV
    needs: dev-plan
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: dev
      step: apply

  # NPR
  npr-plan:
    name: NPR
    needs: dev-apply
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: npr
      step: apply
    if: ${{ inputs.skip_npr != 'true' }}

  npr-apply:
    name: NPR
    needs: npr-plan
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: npr
      step: apply

  # PRD
  prd-plan:
    name: PRD
    needs: npr-apply
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: prd
      step: plan
    if: ${{ inputs.skip_prd != 'true' }}

  prd-apply:
    name: PRD
    needs: prd-plan
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/heads/feature/') }}
    uses: ./.github/workflows/env-template.yaml
    with:
      environment: prd
      step: apply
